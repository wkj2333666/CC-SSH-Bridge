name: Cross architecture

on:
  push:
    branches:
      - main
    paths:
      - Cargo.lock
      - Cargo.toml
      - src/**
      - .github/workflows/cross-architecture.yml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-architecture-main
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.91.1"
  CROSS_VERSION: "0.2.5"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            bins: --bin cc-ssh-bridge
          - target: aarch64-unknown-linux-gnu
            bins: --bin cc-ssh-bridge
          - target: armv7-unknown-linux-gnueabihf
            bins: --bin cc-ssh-bridge
          - target: x86_64-unknown-linux-musl
            bins: --bin cc-ssh-bridge --bin cc-ssh-bridge-helper
          - target: aarch64-unknown-linux-musl
            bins: --bin cc-ssh-bridge --bin cc-ssh-bridge-helper
          - target: armv7-unknown-linux-musleabihf
            bins: --bin cc-ssh-bridge-helper
          - target: riscv64gc-unknown-linux-gnu
            bins: --bin cc-ssh-bridge --bin cc-ssh-bridge-helper
          - target: powerpc64le-unknown-linux-gnu
            bins: --bin cc-ssh-bridge --bin cc-ssh-bridge-helper
          - target: s390x-unknown-linux-gnu
            bins: --bin cc-ssh-bridge --bin cc-ssh-bridge-helper
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore pinned Rust toolchain cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.rustup/toolchains/${{ env.RUST_TOOLCHAIN }}-*
          key: ${{ runner.os }}-${{ runner.arch }}-rust-toolchain-${{ env.RUST_TOOLCHAIN }}-minimal

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: Restore shared Cargo dependency cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-rust-deps-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-deps-${{ env.RUST_TOOLCHAIN }}-

      - name: Restore cross binary cache
        id: cross-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/bin/cross
          key: ${{ runner.os }}-${{ runner.arch }}-cross-${{ env.RUST_TOOLCHAIN }}-${{ env.CROSS_VERSION }}

      - name: Install pinned cross compiler
        if: steps.cross-cache.outputs.cache-hit != 'true'
        run: cargo +"$RUST_TOOLCHAIN" install cross --version "$CROSS_VERSION" --locked

      - name: Restore target cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target
          key: ${{ runner.os }}-rust-target-cross-${{ env.RUST_TOOLCHAIN }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-target-cross-${{ env.RUST_TOOLCHAIN }}-${{ matrix.target }}-

      - name: Cross-build release binaries
        shell: bash
        env:
          CARGO_TERM_COLOR: never
          TARGET: ${{ matrix.target }}
          BINS: ${{ matrix.bins }}
        run: |
          set +e
          set -o pipefail
          cross +"$RUST_TOOLCHAIN" build --release --locked --target "$TARGET" $BINS \
            2>&1 | tee cross-build.log
          cross_status=${PIPESTATUS[0]}
          if (( cross_status != 0 )); then
            detail="$(tail -n 40 cross-build.log)"
            detail="${detail//'%'/'%25'}"
            detail="${detail//$'\r'/'%0D'}"
            detail="${detail//$'\n'/'%0A'}"
            echo "::error file=.github/workflows/cross-architecture.yml,line=82,title=Cross build output::$TARGET%0A$detail"
          fi
          exit "$cross_status"
