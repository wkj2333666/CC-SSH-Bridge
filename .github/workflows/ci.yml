name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.91.1"

jobs:
  quality:
    name: Rust quality and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore pinned Rust toolchain cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.rustup/toolchains/${{ env.RUST_TOOLCHAIN }}-*
          key: ${{ runner.os }}-${{ runner.arch }}-rust-toolchain-${{ env.RUST_TOOLCHAIN }}-quality-components

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup component add rustfmt clippy --toolchain "$RUST_TOOLCHAIN"

      - name: Restore shared Cargo dependency cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-rust-deps-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-deps-${{ env.RUST_TOOLCHAIN }}-

      - name: Restore ripgrep tool cache
        id: ripgrep-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/bin/rg
          key: ${{ runner.os }}-${{ runner.arch }}-ripgrep-14.1.0

      - name: Install command-line test dependencies
        run: |
          if [ ! -x "$HOME/.local/bin/rg" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ripgrep
            mkdir -p "$HOME/.local/bin"
            install -m 0755 /usr/bin/rg "$HOME/.local/bin/rg"
          fi
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: Check formatting
        run: cargo +"$RUST_TOOLCHAIN" fmt --all -- --check

      - name: Run Clippy
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          set -o pipefail
          cargo +"$RUST_TOOLCHAIN" clippy --all-targets --all-features --locked -- -D warnings \
            2>&1 | tee clippy-output.log
          clippy_status=${PIPESTATUS[0]}
          if (( clippy_status != 0 )); then
            tail -n 200 clippy-output.log \
              | grep -E '^(error|warning|[[:space:]]*-->|[[:space:]]*\||[[:space:]]*=[[:space:]]*(help|note):)' \
              | while IFS= read -r detail; do
              if [[ -n "$detail" ]]; then
                detail="${detail//'%'/'%25'}"
                detail="${detail//$'\r'/'%0D'}"
                detail="${detail//$'\n'/'%0A'}"
                echo "::error file=.github/workflows/ci.yml,line=43,title=Rust Clippy output::$detail"
              fi
            done
          fi
          exit "$clippy_status"

      - name: Run tests
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          set -o pipefail
          cargo +"$RUST_TOOLCHAIN" test --all-targets --all-features --locked -- --test-threads=1 \
            2>&1 | tee test-output.log
          test_status=${PIPESTATUS[0]}
          if (( test_status != 0 )); then
            tail -n 200 test-output.log \
              | grep -E '^(test .* FAILED|---- .* stdout ----|thread .* panicked at|assertion .* failed|[[:space:]]+(left|right|note):|failures:|[[:space:]]+[[:alnum:]_]+(::[[:alnum:]_]+)+|test result: FAILED|error: test failed)' \
              | while IFS= read -r detail; do
              if [[ -n "$detail" ]]; then
                detail="${detail//'%'/'%25'}"
                detail="${detail//$'\r'/'%0D'}"
                detail="${detail//$'\n'/'%0A'}"
                echo "::error file=.github/workflows/ci.yml,line=51,title=Rust test output::$detail"
              fi
            done
          fi
          exit "$test_status"

      - name: Build release binary
        run: cargo +"$RUST_TOOLCHAIN" build --release --locked

      - name: Validate source package metadata
        shell: bash
        run: |
          set -euo pipefail
          test ! -e bin/cc-ssh-bridge
          test -f .mcp.json
          cargo_version="$(cargo +"$RUST_TOOLCHAIN" metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          plugin_version="$(jq -r '.version' .claude-plugin/plugin.json)"
          test "$cargo_version" = "$plugin_version"
          jq -e '.mcpServers["ssh-bridge"].args == ["mcp"]' .mcp.json >/dev/null

  diagnostics:
    name: Release edit-cache diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore pinned Rust toolchain cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.rustup/toolchains/${{ env.RUST_TOOLCHAIN }}-*
          key: ${{ runner.os }}-${{ runner.arch }}-rust-toolchain-${{ env.RUST_TOOLCHAIN }}-diagnostics

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: Restore shared Cargo dependency cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-rust-deps-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-deps-${{ env.RUST_TOOLCHAIN }}-

      - name: Install diagnostic dependencies
        run: |
          if [ ! -x /usr/bin/rg ] || [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ripgrep openssh-server
          fi
          sudo install -d -m 0755 /run/sshd

      - name: Prepare release diagnostic binaries
        run: |
          cargo +"$RUST_TOOLCHAIN" test --release --features profile --locked --no-run \
            --test performance_acceptance \
            --test real_ssh

      - name: Gate edit-cache latency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          cargo +"$RUST_TOOLCHAIN" test --release --features profile --locked \
            --test performance_acceptance task13_release_edit_cache_latency_profile \
            -- --nocapture 2>&1 | tee diagnostics/profile-edit-cache.log

      - name: Gate edit-cache RSS
        shell: bash
        run: |
          set -euo pipefail
          cargo +"$RUST_TOOLCHAIN" test --release --features profile --locked \
            --test performance_acceptance task13_release_edit_cache_rss_fresh_child \
            -- --nocapture 2>&1 | tee diagnostics/rss-edit-cache.log

      - name: Run required real SSH edit-cache integration
        env:
          CC_SSH_BRIDGE_REQUIRE_REAL_SSH: "1"
        run: |
          cargo +"$RUST_TOOLCHAIN" test --release --features profile --locked \
            --test real_ssh \
            real_localhost_sshd_covers_transport_shell_files_mutation_and_cancellation \
            -- --nocapture

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: edit-cache-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14
